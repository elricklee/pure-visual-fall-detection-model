model_name: yolov8n-pose
model_stage: fp32_current
task: pose
model_class:
  0: person

artifacts:
  pytorch: artifacts/pytorch/fall_pose_384_best.pt
  onnx: artifacts/onnx/fall_pose_384_fp32.onnx
  pytorch_sha256: 4F77F9265D213C7018B7EA8FCBECA343577F3DD0835CE9F81AD5E8F58E778B18
  onnx_sha256: 8C8BA9001CD7D56BD017EA85FC11E7D19BEBCF2DFD84C3FC5DCDF49462A38E3D

input:
  name: images
  shape: [1, 3, 384, 384]
  layout: NCHW
  dtype: float32
  color_order: RGB
  resize: letterbox
  letterbox_auto: false
  letterbox_padding_value: 114
  scale: 0.00392156862745098
  mean: [0.0, 0.0, 0.0]
  std: [1.0, 1.0, 1.0]

output:
  name: output0
  shape: [1, 56, 3024]
  dtype: float32
  layout: BCN
  box_format: xywh
  box_channels: 4
  class_score_channels: 1
  keypoint_count: 17
  keypoint_dimensions: 3
  keypoint_order: COCO
  keypoint_values: [x, y, confidence]
  note: "fall/normal 不是模型类别，而是关键点几何与时序后处理结果。"

postprocess:
  confidence_threshold: 0.35
  nms_iou_threshold: 0.70
  nms_in_onnx: false
  coordinate_restore: "按 letterbox 的缩放比例和 padding 映射回原图。"
  fall_logic: fall_detection/fall_logic.py
  state_machine: fall_detection/state_machine.py
  fall_score_threshold: 0.70
  temporal_window: 5
  temporal_min_fall_votes: 3

export:
  format: onnx
  opset: 12
  batch: 1
  dynamic: false
  simplify: true
  simplifier: onnxslim
  nms: false
  precision: fp32

validation:
  sample_tensor: samples/reference_input_384.npy
  pytorch_output_shape: [1, 56, 3024]
  onnx_output_shape: [1, 56, 3024]
  max_abs_diff: 0.00067138671875
  mean_abs_diff: 0.00000823782102088444

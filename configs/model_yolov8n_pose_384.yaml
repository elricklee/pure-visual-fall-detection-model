model_name: yolov8n-pose
model_stage: day2_baseline
task: pose
model_class:
  0: person

artifacts:
  pytorch: artifacts/pytorch/yolov8n-pose.pt
  onnx: artifacts/onnx/yolov8n_pose_384_fp32.onnx
  pytorch_sha256: 8D69EB914E660742CD0101E1B13D91E564F7F3DA065EBA8860D06941843B1105
  onnx_sha256: 25332F80A553F41E730DCEADB04E451FCA1C2625485FF5F9EE9A618A5F8CF123

input:
  name: images
  shape: [1, 3, 384, 384]
  layout: NCHW
  dtype: float32
  color_order: RGB
  resize: letterbox
  letterbox_auto: false
  letterbox_padding_value: 114
  scale: 0.00392156862745098
  mean: [0.0, 0.0, 0.0]
  std: [1.0, 1.0, 1.0]

output:
  name: output0
  shape: [1, 56, 3024]
  dtype: float32
  layout: BCN
  box_format: xywh
  box_channels: 4
  class_score_channels: 1
  keypoint_count: 17
  keypoint_dimensions: 3
  keypoint_order: COCO
  keypoint_values: [x, y, confidence]
  note: "fall/normal 不是模型类别，而是关键点几何与时序后处理结果。"

postprocess:
  confidence_threshold: 0.35
  nms_iou_threshold: 0.70
  nms_in_onnx: false
  coordinate_restore: "按 letterbox 的缩放比例和 padding 映射回原图。"
  fall_logic: fall_detection/fall_logic.py
  state_machine: fall_detection/state_machine.py
  fall_score_threshold: 0.70
  temporal_window: 5
  temporal_min_fall_votes: 3

export:
  format: onnx
  opset: 12
  batch: 1
  dynamic: false
  simplify: false
  nms: false
  precision: fp32
